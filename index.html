<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AFS Paper Airplanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet" />
<style>
/* AFS Paper Airplanes — Flight Manual aesthetic
   Phone-first; desktop frames the phone. */

:root {
  /* Tones */
  --paper: oklch(96.2% 0.012 85);
  --paper-2: oklch(94% 0.014 84);
  --paper-3: oklch(91% 0.016 82);
  --ink: oklch(22% 0.035 248);
  --ink-2: oklch(38% 0.03 248);
  --ink-3: oklch(56% 0.025 248);
  --rule: oklch(82% 0.018 80);
  --rule-soft: oklch(88% 0.014 80);
  --accent: oklch(58% 0.17 32);    /* signal orange-red */
  --accent-2: oklch(48% 0.16 32);
  --keel: oklch(82% 0.08 350);     /* pink keel zone */
  --tape: oklch(86% 0.10 95);      /* yellow tape */
  --vline: oklch(62% 0.13 245);    /* keel vertical blue */

  --shadow-card: 0 1px 0 rgba(20,30,55,.04), 0 1px 3px rgba(20,30,55,.06), 0 8px 24px -12px rgba(20,30,55,.18);
  --radius: 14px;

  --font-display: 'Newsreader', 'Iowan Old Style', 'Palatino', serif;
  --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --tab-h: 64px;
  --topbar-h: 56px;
  --safe-top: env(safe-area-inset-top, 0);
  --safe-bot: env(safe-area-inset-bottom, 0);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper-3);
  font-feature-settings: "ss01", "cv11";
}

/* Phone shell — always centered, max 480 wide. On desktop framed. */
.app {
  position: relative;
  margin: 0 auto;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: var(--paper);
  overflow-x: hidden;
}

/* Subtle paper texture */
.app::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(46,40,28,.035) 1px, transparent 1px),
    radial-gradient(rgba(46,40,28,.02) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
  opacity: .9;
  z-index: 0;
}

@media (min-width: 720px) {
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, oklch(94% 0.02 85), transparent 60%),
      var(--paper-3);
    padding: 32px 0 32px;
  }
  .app {
    border: 1px solid var(--rule);
    border-radius: 28px;
    box-shadow:
      0 1px 0 rgba(20,30,55,.04),
      0 30px 60px -30px rgba(20,30,55,.25),
      0 80px 120px -80px rgba(20,30,55,.20);
    min-height: calc(100vh - 64px);
    overflow: hidden;
  }
}

/* ---- Top bar ---- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: calc(var(--topbar-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: grid;
  grid-template-columns: 56px 1fr 56px;
  align-items: center;
  background: color-mix(in oklab, var(--paper) 86%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.topbar .back, .topbar .more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: var(--topbar-h);
  color: var(--ink);
  text-decoration: none;
  font: 500 14px/1 var(--font-sans);
}
.topbar .back svg { width: 22px; height: 22px; }
.topbar .title {
  text-align: center;
  font: 600 14px/1 var(--font-sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.topbar .title small {
  display: block;
  font: 500 10px/1.4 var(--font-mono);
  color: var(--ink-3);
  letter-spacing: 0.12em;
  margin-top: 3px;
}

/* ---- Bottom tab bar ---- */
.tabbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tab-h) + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: color-mix(in oklab, var(--paper) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-top: 1px solid var(--rule-soft);
}
.tabbar a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-decoration: none;
  color: var(--ink-3);
  font: 500 10px/1 var(--font-sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
}
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.is-active { color: var(--ink); }
.tabbar a.is-active::before {
  content: "";
  position: absolute;
  top: 6px;
  width: 28px; height: 3px;
  background: var(--accent);
  border-radius: 0;
}

/* ---- Page scaffold ---- */
.page {
  position: relative;
  z-index: 1;
  padding: 0 20px 28px;
  min-height: calc(100vh - var(--topbar-h) - var(--tab-h));
}
.section {
  padding: 24px 0 8px;
}
.section + .section { padding-top: 8px; }

.kicker {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.kicker::before {
  content: "";
  width: 18px; height: 1px;
  background: var(--ink-3);
  display: inline-block;
}

.h1 {
  font: 400 38px/1.04 var(--font-display);
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 10px 0 0;
}
.h1 em { font-style: italic; color: var(--accent); }
.h2 {
  font: 400 26px/1.1 var(--font-display);
  letter-spacing: -0.015em;
  margin: 0;
}
.h3 {
  font: 600 14px/1.2 var(--font-sans);
  letter-spacing: 0.02em;
  margin: 0;
}
.lede {
  color: var(--ink-2);
  font-size: 15px;
  margin: 12px 0 0;
  text-wrap: pretty;
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 18px;
  border-radius: 999px;
  font: 600 14px/1 var(--font-sans);
  letter-spacing: 0.02em;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  background: var(--ink);
  color: var(--paper);
  transition: transform .12s ease, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn--accent { background: var(--accent); color: var(--paper); }
.btn--block { width: 100%; }
.btn .arrow { transform: translateY(-1px); }

/* ---- Plane card ---- */
.plane-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin: 12px 0 0;
}
.plane-card {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  padding: 18px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--paper);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  isolation: isolate;
  min-height: 168px;
}
.plane-card .silh {
  /* Constrain to the card interior so the full plane shows; no overflow crop. */
  position: absolute;
  inset: 14px 14px 14px auto;
  width: 50%;
  z-index: 0;
  pointer-events: none;
}
.plane-card .silh svg { width: 100%; height: auto; display: block; }
.plane-card .silh img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  object-position: center right;
}
.plane-card .meta {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.plane-card .id {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.18em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.plane-card .name {
  font: 400 26px/1.05 var(--font-display);
  letter-spacing: -0.015em;
  color: var(--ink);
}
.plane-card .desc {
  font: 400 13px/1.4 var(--font-sans);
  color: var(--ink-2);
  max-width: 22ch;
}
.plane-card .badges {
  position: absolute;
  top: 14px; right: 14px;
  display: flex; gap: 6px;
  z-index: 2;
}
.badge {
  font: 500 10px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--ink-2);
  border: 1px solid var(--rule);
}
.badge--accent { background: var(--accent); color: var(--paper); border-color: transparent; }

/* ---- Hero ---- */
.hero {
  position: relative;
  margin: 8px 0 14px;
  padding: 22px 20px 24px;
  border-radius: 18px;
  background:
    linear-gradient(180deg, oklch(28% 0.04 248), oklch(20% 0.04 250));
  color: var(--paper);
  overflow: hidden;
  isolation: isolate;
}
.hero::before {
  /* graph paper */
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 48px 48px, 48px 48px, 12px 12px, 12px 12px;
  z-index: 0;
}
.hero > * { position: relative; z-index: 1; }
.hero .h1 { color: var(--paper); }
.hero .h1 em { color: oklch(80% 0.14 60); }
.hero .lede { color: oklch(82% 0.02 80); }
.hero .stats {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  padding: 12px 0 0;
  border-top: 1px solid rgba(255,255,255,.14);
}
.hero .stat { padding: 0 4px; }
.hero .stat .v {
  font: 400 22px/1 var(--font-display);
  display: block;
  margin-bottom: 4px;
}
.hero .stat .k {
  font: 500 10px/1.2 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: oklch(72% 0.02 80);
}

/* ---- Quick actions row on home ---- */
.quick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0 0;
}
.quick a {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 110px;
  padding: 14px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  position: relative;
  overflow: hidden;
}
.quick a .lbl {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.quick a .ttl {
  font: 400 18px/1.1 var(--font-display);
  margin-top: 8px;
}
.quick a .ic {
  position: absolute;
  right: 10px; bottom: 10px;
  width: 36px; height: 36px;
  color: var(--ink-3);
  opacity: .6;
}

/* ---- Reusable list rows ---- */
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 14px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
}
.row + .row { margin-top: 8px; }
.row .num {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--rule);
  border-radius: 50%;
  font: 500 12px/1 var(--font-mono);
  color: var(--ink-2);
  flex: none;
}
.row .body { flex: 1; }
.row .body .t { font: 600 14px/1.2 var(--font-sans); }
.row .body .s { font: 400 12px/1.4 var(--font-sans); color: var(--ink-3); margin-top: 2px;}

/* ---- Builder ---- */
.builder {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-top: 8px;
}
.builder .stage {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--rule);
  border-radius: 18px;
  background:
    linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  overflow: hidden;
}
.builder .stage::after {
  /* gridded plot */
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, oklch(86% 0.018 80) 1px, transparent 1px),
    linear-gradient(to bottom, oklch(86% 0.018 80) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: .35;
  pointer-events: none;
}
.builder .stage > svg {
  position: relative;
  z-index: 1;
  width: 100%; height: 100%;
  display: block;
}
.builder .step-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.builder .step-meta .figref {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.builder .step-meta .stepnum {
  font: 400 22px/1 var(--font-display);
  color: var(--ink);
}
.builder .step-meta .total { color: var(--ink-3); }
.builder .step-text {
  font: 400 15px/1.5 var(--font-sans);
  color: var(--ink);
  text-wrap: pretty;
}
.builder .progress {
  position: relative;
  height: 4px;
  background: var(--rule-soft);
  border-radius: 2px;
  overflow: hidden;
}
.builder .progress > span {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width .4s cubic-bezier(.65,.05,.36,1);
}
.builder .controls {
  display: grid;
  grid-template-columns: 56px 1fr 56px;
  gap: 8px;
}
.builder .controls button {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 999px;
  height: 48px;
  font: 600 14px/1 var(--font-sans);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.builder .controls button.primary { background: var(--ink); color: var(--paper); border-color: transparent; }
.builder .controls button:disabled { opacity: .35; cursor: not-allowed; }

/* Legend strip */
.legend {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px 12px;
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  border-radius: 12px;
}
.legend .lg {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 11px/1.2 var(--font-mono);
  letter-spacing: 0.04em;
  color: var(--ink-2);
}
.legend .lg::before {
  content: "";
  width: 22px; height: 0;
  flex: none;
}
.legend .lg.mountain::before { border-top: 1.5px solid var(--ink); }
.legend .lg.valley::before  { border-top: 1.5px dotted var(--ink); }
.legend .lg.cut::before     { border-top: 1.5px dashed var(--accent); }

/* ---- Template page ---- */
.template-frame {
  margin: 14px 0;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 10px;
}
.template-frame svg { width: 100%; height: auto; display: block; }
.template-help {
  font: 400 13px/1.5 var(--font-sans);
  color: var(--ink-2);
}
.template-help li { margin: 4px 0; }
.template-help code { font-family: var(--font-mono); font-size: 12px; }

/* ---- Fine-tuning troubleshooter ---- */
.tune-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 18px 18px 20px;
  overflow: hidden;
}
.tune-card .symptom {
  font: 400 22px/1.18 var(--font-display);
  color: var(--ink);
  margin: 6px 0 10px;
  text-wrap: balance;
}
.tune-card .why {
  font: 400 13px/1.5 var(--font-sans);
  color: var(--ink-2);
  border-left: 2px solid var(--accent);
  padding-left: 12px;
  margin: 6px 0 14px;
}
.tune-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tune-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  border-radius: 12px;
  text-align: left;
  font: 500 14px/1.3 var(--font-sans);
  color: var(--ink);
  cursor: pointer;
  transition: background .15s;
}
.tune-opt:hover { background: var(--paper-3); }
.tune-opt .arrow { margin-left: auto; color: var(--ink-3); }
.tune-trail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font: 500 11px/1.2 var(--font-mono);
  letter-spacing: 0.04em;
  color: var(--ink-3);
  margin: 10px 0 6px;
}
.tune-trail .crumb { color: var(--ink-3); }
.tune-trail .crumb + .crumb::before { content: "›"; padding: 0 6px; }
.tune-result {
  background: linear-gradient(180deg, oklch(98% 0.02 90), oklch(95% 0.025 88));
  border: 1px solid oklch(80% 0.06 80);
  padding: 18px;
  border-radius: 16px;
}
.tune-result .lbl {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.tune-result .fix {
  font: 400 22px/1.2 var(--font-display);
  margin: 8px 0 10px;
}
.tune-result .how {
  font: 400 14px/1.5 var(--font-sans);
  color: var(--ink);
}

/* ---- Preflight checklist ---- */
.checklist { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.check {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: start;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--paper);
  cursor: pointer;
  user-select: none;
}
.check input { display: none; }
.check .box {
  width: 22px; height: 22px;
  border: 1.5px solid var(--ink-3);
  border-radius: 6px;
  display: grid; place-items: center;
  margin-top: 1px;
  transition: background .15s, border-color .15s;
}
.check .box svg { opacity: 0; width: 14px; height: 14px; color: var(--paper); transition: opacity .15s; }
.check input:checked + .box { background: var(--ink); border-color: var(--ink); }
.check input:checked + .box svg { opacity: 1; }
.check input:checked ~ .body .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.check .body { display: flex; flex-direction: column; gap: 2px; }
.check .body .t { font: 600 14px/1.3 var(--font-sans); }
.check .body .s { font: 400 13px/1.5 var(--font-sans); color: var(--ink-2); }

/* ---- Print rules for templates ---- */
@media print {
  body { background: white; }
  .app {
    max-width: none;
    box-shadow: none;
    border: 0;
    border-radius: 0;
  }
  .topbar, .tabbar, .no-print { display: none !important; }
  .page { padding: 0; }
  .template-frame { border: 0; padding: 0; }
  @page { size: letter; margin: 0.5in; }
}

/* ---- Utility ---- */
.dim { color: var(--ink-3); }
.mono { font-family: var(--font-mono); }
.flex { display: flex; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.center { text-align: center; }

.divider {
  height: 1px;
  background: var(--rule-soft);
  margin: 16px 0;
}

a { color: var(--ink); }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* plane detail */
.silh-hero{margin:12px -20px 0;padding:24px 20px 18px;background:linear-gradient(180deg,oklch(28% .04 248),oklch(20% .04 250));color:var(--paper);position:relative;overflow:hidden}
.silh-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.silh-hero .silh-frame{position:relative;aspect-ratio:1.2/1;margin:0 auto;max-width:320px;display:grid;place-items:center}
.silh-hero .silh-frame img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(0,0,0,.45))}

<script>
/* AFS Tweaks — applies stored CSS overrides on every page,
   and (on index) renders a floating Tweaks panel that the host can toggle. */
(function () {
  const KEY = "afs.tweaks.v1";

  const ACCENTS = {
    "orange":  { "--accent": "oklch(58% 0.17 32)",  "--accent-2": "oklch(48% 0.16 32)"  },
    "blue":    { "--accent": "oklch(58% 0.17 240)", "--accent-2": "oklch(48% 0.16 240)" },
    "green":   { "--accent": "oklch(58% 0.17 145)", "--accent-2": "oklch(48% 0.16 145)" },
    "violet":  { "--accent": "oklch(58% 0.17 300)", "--accent-2": "oklch(48% 0.16 300)" }
  };
  const TONES = {
    "warm":    { "--paper": "oklch(96.2% 0.012 85)", "--paper-2": "oklch(94% 0.014 84)", "--paper-3": "oklch(91% 0.016 82)" },
    "cool":    { "--paper": "oklch(97% 0.008 240)",  "--paper-2": "oklch(94% 0.010 240)", "--paper-3": "oklch(91% 0.012 240)" },
    "neutral": { "--paper": "oklch(97% 0.003 0)",    "--paper-2": "oklch(94% 0.004 0)",   "--paper-3": "oklch(91% 0.005 0)" }
  };

  const DEFAULTS = { accent: "orange", tone: "warm" };

  function read() {
    try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || "{}")); }
    catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function write(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

  function apply(s) {
    const root = document.documentElement;
    const accent = ACCENTS[s.accent] || ACCENTS.orange;
    const tone = TONES[s.tone] || TONES.warm;
    Object.entries(accent).forEach(([k, v]) => root.style.setProperty(k, v));
    Object.entries(tone).forEach(([k, v]) => root.style.setProperty(k, v));
  }

  // apply immediately
  let state = read();
  apply(state);

  // expose for panel
  window.__afsTweaks = {
    get: () => Object.assign({}, state),
    set(patch) {
      state = Object.assign({}, state, patch);
      write(state); apply(state);
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*'); } catch (e) {}
    },
    reset() { state = Object.assign({}, DEFAULTS); write(state); apply(state); }
  };
})();

</script>

/* ========= ROUTER ========= */
const ROUTES = {};
const pageInits = {};

function navigate(hash, pushState) {
  if (pushState) history.pushState(null, '', hash || '#');
  renderRoute(hash || '#home');
}
function renderRoute(hash) {
  const raw = hash.replace(/^#/, '') || 'home';
  const qi = raw.indexOf('?');
  const route = qi >= 0 ? raw.slice(0, qi) : raw;
  const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
  const fn = ROUTES[route] || ROUTES['home'];
  const app = document.getElementById('app');
  app.classList.add('fading');
  setTimeout(function() {
    app.innerHTML = fn(params);
    app.classList.remove('fading');
    window.scrollTo(0, 0);
    bindLinks();
    if (pageInits[route]) pageInits[route](params);
  }, 80);
}
function bindLinks() {
  var map = {
    'index.html#hangar': '#hangar',
    'index.html': '#home',
    'plane.html': '#plane',
    'builder.html': '#builder',
    'preflight.html': '#preflight',
    'tune.html': '#tune',
    'template.html': '#template'
  };
  document.querySelectorAll('a[href]').forEach(function(a) {
    var href = a.getAttribute('href');
    if (!href) return;
    // remap multi-file hrefs
    for (var k in map) {
      if (href === k || href.startsWith(k + '?')) {
        href = href.replace(k, map[k]);
        break;
      }
    }
    if (href.startsWith('#')) {
      a.setAttribute('href', href);
      a.addEventListener('click', function(e) {
        e.preventDefault();
        navigate(href, true);
      });
    }
  });
}
window.addEventListener('popstate', function() { renderRoute(location.hash || '#home'); });

/* ========= SHARED COMPONENTS ========= */
function tabbar(active) {
  var tabs = [
    { id:'home',      hash:'#home',      label:'Manual',    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>' },
    { id:'hangar',    hash:'#hangar',    label:'Hangar',    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l9-5 9 5v10M7 20v-7h10v7"/></svg>' },
    { id:'preflight', hash:'#preflight', label:'Preflight', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>' },
    { id:'tune',      hash:'#tune',      label:'Fine-Tune', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>' }
  ];
  return '<nav class="tabbar">' +
    tabs.map(function(t) {
      return '<a href="' + t.hash + '" class="' + (active === t.id ? 'is-active' : '') + '">' +
        t.icon + '<span>' + t.label + '</span></a>';
    }).join('') +
    '</nav>';
}
function backBtn(href) {
  return '<a class="back" href="' + href + '" aria-label="Back">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
    '</a>';
}
function dots(n, total) {
  if (!total) total = 5;
  var s = '';
  for (var i = 0; i < total; i++) s += '<span class="dot' + (i < n ? ' on' : '') + '"></span>';
  return s;
}
function pad(n) { return String(n).padStart(2, '0'); }

pageInits['builder'] = function(params) {
  var id = params.get('id') || 'p11';
  var steps = window.STEPS[id] || window.STEPS.p11;
  var KEY = 'afs.builder.' + id + '.idx';
  var i = parseInt(sessionStorage.getItem(KEY) || '0', 10);
  if (isNaN(i) || i < 0 || i >= steps.length) i = 0;

  var bStage   = document.getElementById('bStage');
  var bLabel   = document.getElementById('bLabel');
  var bHead    = document.getElementById('bHead');
  var bText    = document.getElementById('bText');
  var bCounter = document.getElementById('bCounter');
  var bSub     = document.getElementById('bSub');
  var bPrev    = document.getElementById('bPrev');
  var bNext    = document.getElementById('bNext');
  var bNext2   = document.getElementById('bNext2');
  var bReplay  = document.getElementById('bReplay');
  var bTicks   = document.getElementById('bTicks');
  var bJump    = document.getElementById('bJump');

  bJump.innerHTML = steps.map(function(_, n) {
    return '<button data-n="' + n + '" aria-label="Step ' + (n+1) + '">' + pad(n+1) + '</button>';
  }).join('');
  bJump.querySelectorAll('button').forEach(function(b) {
    b.addEventListener('click', function() { goto(parseInt(b.dataset.n, 10)); });
  });

  function drawStep() {
    sessionStorage.setItem(KEY, String(i));
    var s = steps[i];
    bStage.innerHTML = AFS.diagrams.render(s.d, 'STEP ' + (i+1));
    bLabel.textContent = 'FIG. ' + pad(i+1);
    bHead.textContent  = s.title || ('Step ' + (i+1));
    bText.textContent  = s.text  || '';
    bCounter.textContent = pad(i+1) + '/' + pad(steps.length);
    if (bSub) bSub.textContent = 'STEP ' + pad(i+1) + '/' + pad(steps.length);
    bTicks.innerHTML = steps.map(function(_, n) {
      return '<span class="' + (n < i ? 'done' : n === i ? 'cur' : '') + '"></span>';
    }).join('');
    bJump.querySelectorAll('button').forEach(function(b, n) {
      b.classList.toggle('cur',  n === i);
      b.classList.toggle('done', n < i);
    });
    var cur = bJump.querySelector('button.cur');
    if (cur) cur.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    bPrev.disabled = i <= 0;
    if (i >= steps.length - 1) {
      bNext.classList.add('done');
      bNext.innerHTML = 'Build complete <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
    } else {
      bNext.classList.remove('done');
      bNext.innerHTML = 'Next step <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    }
  }
  function goto(n) { i = Math.max(0, Math.min(steps.length-1, n)); drawStep(); }

  bPrev.addEventListener('click',  function() { goto(i-1); });
  bNext.addEventListener('click',  function() { if (i >= steps.length-1) { navigate('#tune', true); return; } goto(i+1); });
  bNext2.addEventListener('click', function() { goto(i+1); });
  bReplay.addEventListener('click', drawStep);
  window.addEventListener('keydown', function(e) { if (e.key==='ArrowLeft') goto(i-1); if (e.key==='ArrowRight') goto(i+1); });
  var sx = 0;
  document.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; });
  document.addEventListener('touchend',   function(e) { var dx = e.changedTouches[0].clientX-sx; if (Math.abs(dx)>60) goto(i+(dx<0?1:-1)); });
  drawStep();
};

    '</header>' +

        '<h2 class="h1" style="margin-top:8px;">Run the <em>preflight</em>.</h2>' +

pageInits['preflight'] = function() {
  var KEY = 'afs.preflight.v1';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  var list   = document.getElementById('pfChecks');
  var ring   = document.getElementById('pfRing');
  var num    = document.getElementById('pfNum');
  var status = document.getElementById('pfStatus');
  var ready  = document.getElementById('pfReady');
  function draw() {
    list.innerHTML = '';
    window.PREFLIGHT.forEach(function(c, i) {
      var on = !!state[i];
      var card = document.createElement('div');
      card.className = 'check-card' + (on ? ' is-on' : '');
      card.innerHTML =
        '<div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div>' +
        '<div><span class="cn">CHECK ' + pad(i+1) + '</span><div class="ct">' + c.t + '</div><div class="cs">' + c.s + '</div></div>';
      card.addEventListener('click', function() {
        state[i] = !state[i];
        localStorage.setItem(KEY, JSON.stringify(state));
        draw();
      });
      list.appendChild(card);
    });
    var total = window.PREFLIGHT.length;
    var done  = window.PREFLIGHT.reduce(function(n,_,i) { return n + (state[i] ? 1 : 0); }, 0);
    num.textContent = done + '/' + total;
    ring.setAttribute('stroke-dashoffset', String(100 - (done/total)*100));
    status.textContent = done === 0 ? 'Not yet ready' : done < total ? 'Cabin checks underway' : 'Cleared for flight';
    ready.style.display = done === total ? 'block' : 'none';
  }
  document.getElementById('pfClear').addEventListener('click', function() {
    state = {}; localStorage.setItem(KEY, JSON.stringify(state)); draw();
  });
  draw();
};

ROUTES['tune'] = function() {
  return '<header class="topbar">' +
      backBtn('#home') +
      '<div class="title">FINE-TUNE<small id="tuneSub">DIAGNOSTIC</small></div>' +

        '<p class="lede">Tell the diagnostic what your plane is doing in the air. We\'ll walk you to the fix in 1\u20133 taps.</p>' +
      '</section>' +
      '<section class="section"><div id="tuneCrumbs" class="crumbs"></div><div id="tuneStage"></div></section>' +
      '<section class="section" id="tunePrinciples">' +
        '<span class="kicker">First principles</span>' +
        '<div class="principle"><strong>Bend, don\'t crease</strong>Every adjustment is a small bend \u2014 never a hard fold. If you crease the flap you can\'t undo it.</div>' +
        '<div class="principle" style="margin-top:10px;"><strong>One change at a time</strong>Throw three times, observe, then make one adjustment. Two changes at once and you can\'t tell which fixed it.</div>' +
        '<div class="principle" style="margin-top:10px;"><strong>Symmetry first</strong>Sight down the nose. If the wings aren\'t a mirror image, no amount of flap tuning will save the flight.</div>' +
      '</section>' +
    '</main>' +
    tabbar('tune');
};

pageInits['tune'] = function() {
  var stage   = document.getElementById('tuneStage');
  var crumbs  = document.getElementById('tuneCrumbs');
  var intro   = document.getElementById('tuneIntro');
  var princs  = document.getElementById('tunePrinciples');
  var tuneSub = document.getElementById('tuneSub');
  var path = ['start'];

  function labelOf(key) {
    if (key === 'start') return 'Start';
    for (var k in window.TUNE) {
      var n = window.TUNE[k];
      if (n.options) for (var j = 0; j < n.options.length; j++) { if (n.options[j].to === key) return n.options[j].label; }
    }
    return key;
  }
  function go(key)  { path.push(key); draw(); }
  function back()   { if (path.length > 1) { path.pop(); draw(); } }
  function reset()  { path = ['start']; draw(); }

  document.querySelector('.back').addEventListener('click', function(e) {
    if (path.length > 1) { e.preventDefault(); back(); }
  });

  function draw() {
    var cur  = path[path.length-1];
    var node = window.TUNE[cur];
    // breadcrumbs
    crumbs.innerHTML = '';
    path.forEach(function(k, idx) {
      if (idx > 0) { var sep = document.createElement('span'); sep.className = 'sep'; crumbs.appendChild(sep); }
      var btn = document.createElement('button');
      btn.textContent = idx === 0 ? 'Start' : labelOf(k);
      (function(bound_idx) {
        btn.addEventListener('click', function() { path = path.slice(0, bound_idx+1); draw(); });
      })(idx);
      crumbs.appendChild(btn);
    });
    intro.style.display  = path.length === 1 ? 'block' : 'none';
    princs.style.display = path.length === 1 ? 'block' : 'none';
    if (tuneSub) tuneSub.textContent = path.length === 1 ? 'DIAGNOSTIC' : 'STEP ' + path.length;
    // symptom card
    stage.innerHTML = '';
    var sym = document.createElement('div'); sym.className = 'symptom';
    sym.innerHTML = '<div class="slbl">' + (node.fix ? 'Fix' : 'Symptom') + '</div>' +
      '<h2>' + node.symptom + '</h2>' +
      (node.why ? '<p>' + node.why + '</p>' : '');
    stage.appendChild(sym);
    // options
    if (node.options) {
      var wrap = document.createElement('div'); wrap.className = 'options';
      node.options.forEach(function(opt, oi) {
        var b = document.createElement('button'); b.className = 'opt';
        b.innerHTML = '<span class="onum">' + pad(oi+1) + '</span>' +
          '<span class="olbl">' + opt.label + '</span>' +
          '<svg class="oarr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
        (function(to) { b.addEventListener('click', function() { go(to); }); })(opt.to);
        wrap.appendChild(b);
      });
      stage.appendChild(wrap);
    }
    // fix card
    if (node.fix) {
      var card = document.createElement('div'); card.className = 'fix-card';
      card.innerHTML = '<div class="fhd"><span class="fpill">Apply fix</span><span class="fttl">' + node.fix.title + '</span></div>' +
        '<div class="fbody"><ol>' + node.fix.steps.map(function(s) { return '<li><span>' + s + '</span></li>'; }).join('') + '</ol></div>';
      stage.appendChild(card);
      var acts = document.createElement('div'); acts.className = 'fix-actions';
      acts.innerHTML = '<button class="btn btn--block" id="tuneRestart">Restart diagnostic</button><button class="btn btn--ghost btn--block" id="tuneBack2">Back one step</button>';
      stage.appendChild(acts);
      document.getElementById('tuneRestart').addEventListener('click', reset);
      document.getElementById('tuneBack2').addEventListener('click', back);
    }
  }
  draw();
};
